# /etc/nginx/conf.d/qrencoder.conf   (Oracle Linux)
# /etc/nginx/sites-available/qrencoder (Ubuntu, then symlink to sites-enabled)
#
# Replace server_name with your domain (or "_" for IP access).
# For HTTPS run:  sudo certbot --nginx -d your.domain.com

limit_req_zone $binary_remote_addr zone=qr_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self'" always;

    location /api/ {
        limit_req zone=qr_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;   # do not log user input-related requests
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
